<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Домострой</title>
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,"Segoe UI",sans-serif;background:#111713;color:#edf2e9;--frame-height:420px}*{box-sizing:border-box}body{margin:0}header{min-height:54px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"title spacer earth" "status status status";align-items:center;padding:7px 12px;background:#1b241e;border-bottom:1px solid #354239}strong{grid-area:title;font-size:14px;white-space:nowrap;margin-right:12px}.status{grid-area:status;min-width:0;overflow:visible;overflow-wrap:anywhere;white-space:normal;color:#b9c6b8;font-size:12px;line-height:1.3;padding-top:2px}header label{grid-area:earth}iframe{display:block;width:100%;height:var(--frame-height);border:0;background:#e9e6df}@media(max-width:560px){header{padding:6px 8px}strong{font-size:12px;margin-right:8px}.status{font-size:11px}}
</style></head><body>
<header><strong>Домострой</strong><span class="status" id="status" aria-live="polite">Подключаюсь к авторской сессии…</span><label style="margin-left:auto;padding-left:10px;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:5px"><input id="hide-earth" type="checkbox">Скрыть землю</label></header>
<iframe id="viewer" title="Интерактивная 3D-модель дома" sandbox="allow-scripts" srcdoc="<!doctype html><meta charset=utf-8><style>body{margin:0;display:grid;place-items:center;height:100vh;font:16px system-ui;background:#e9e6df;color:#45443f}</style><div>Ожидаю первую модель от автора…</div>"></iframe>
<script>
const $=s=>document.querySelector(s),mcpMode=window.parent!==window,emptyDoc='<!doctype html><meta charset=utf-8><style>body{margin:0;display:grid;place-items:center;height:100vh;font:16px system-ui;background:#e9e6df;color:#45443f}</style><div>Ожидаю первую модель от автора…</div>';let rpcId=0,waiters=new Map(),mcpOrigin=null,displayMode='inline',generation=0,activeSession='',loadedRevision='',cursorSequence=0,viewerDocumentStarted=false,viewerDocumentReady=false,documentToken='',pendingEvent=null,pendingViewer=null,pendingTimer=0,pendingRetries=0,eventFetchInFlight=false,currentPresentation={stage:'materials',intent:'',phase:''},lastSessionState=null;
function rpc(method,params={},timeout=30000){return new Promise((resolve,reject)=>{const id=++rpcId,t=setTimeout(()=>{waiters.delete(id);reject(Error('Истекло время ожидания ответа приложения'))},timeout);waiters.set(id,{initialize:method==='ui/initialize',resolve:v=>{clearTimeout(t);resolve(v)},reject:e=>{clearTimeout(t);reject(e)}});window.parent.postMessage({jsonrpc:'2.0',id,method,params},mcpOrigin||'*')})}
function reportSize(){if(!mcpMode||!mcpOrigin)return;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:Math.min(520,Math.max(360,document.documentElement.scrollHeight)),width:Math.min(1200,Math.max(320,document.documentElement.scrollWidth))}},mcpOrigin)}
function setDisplayMode(mode){displayMode=mode==='fullscreen'?'fullscreen':'inline';document.documentElement.style.setProperty('--frame-height',displayMode==='fullscreen'?'calc(100vh - '+document.querySelector('header').getBoundingClientRect().height+'px)':'420px');reportSize()}
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;const d=e.data;if(!mcpOrigin){const w=waiters.get(d.id);if(!w?.initialize||!e.origin||e.origin==='null')return;mcpOrigin=e.origin}else if(e.origin!==mcpOrigin)return;if(d.method==='ui/notifications/host-context-changed'){setDisplayMode(d.params?.hostContext?.displayMode??d.params?.displayMode);return}if(d.id&&waiters.has(d.id)){const w=waiters.get(d.id);waiters.delete(d.id);d.error?w.reject(Error(d.error.message||'Ошибка MCP')):w.resolve(d.result)}});
function textResult(x){const t=x?.content?.find?.(c=>c.type==='text')?.text;if(!t)throw Error('Сервер приложения вернул пустой ответ');const data=JSON.parse(t);if(x.isError||data.error)throw Error(data.error||t);return data}
async function initialize(){const x=await rpc('ui/initialize',{appInfo:{name:'house-design-app',version:'0.2.0'},appCapabilities:{},protocolVersion:'2026-01-26'});setDisplayMode(x?.hostContext?.displayMode);window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},mcpOrigin);reportSize();return x}
async function callTool(name,args={}){return rpc('tools/call',{name,arguments:args})}
function viewerDocument(html){const hidden=$('#hide-earth').checked;return html+'<script>(()=>{const apply=hidden=>{const earth=document.getElementById("earth");if(earth){earth.checked=!hidden;earth.dispatchEvent(new Event("change"))}};window.addEventListener("message",e=>{if(e.source===window.parent&&e.data?.type==="house-design-earth"&&typeof e.data.hidden==="boolean")apply(e.data.hidden)});apply('+JSON.stringify(hidden)+')})()<\/script>'}
$('#hide-earth').addEventListener('change',()=>{$('#viewer').contentWindow?.postMessage({type:'house-design-earth',hidden:$('#hide-earth').checked},'*')});
function clearPendingTimer(){if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=0}}
function clearViewer(){clearPendingTimer();pendingEvent=null;pendingViewer=null;pendingRetries=0;eventFetchInFlight=false;viewerDocumentStarted=false;viewerDocumentReady=false;documentToken='';loadedRevision='';for(const k of['appliedRevision','appliedEventSequence','canvasId','documentId','rendererId','sceneId','cameraId','controlsId','stage'])delete $('#viewer').dataset[k];$('#viewer').srcdoc=emptyDoc}
function liveLabel(session){if(!session)return 'Начните проектирование дома в этом чате';const phase=currentPresentation.phase||session.phase||session.state||'сессия создана';const stages={sketch:'Эскиз',form:'Форма',materials:'Материалы'};const intent=currentPresentation.intent?` · ${currentPresentation.intent}`:'';return `${stages[currentPresentation.stage]||stages.materials}${intent} · ${phase}`}
function extractBinding(value,depth=0){if(!value||depth>5)return null;const direct=value._meta?.houseDesign;if(direct?.session_id)return direct;if(value.structuredContent?.session_id)return direct?.session_id?direct:{session_id:value.structuredContent.session_id,bind_mode:'new',cursor_sequence:0,session:value.structuredContent.session};if(typeof value.text==='string'){try{return extractBinding(JSON.parse(value.text),depth+1)}catch{}}if(Array.isArray(value.content)){for(const item of value.content){const found=extractBinding(item,depth+1);if(found)return found}}return extractBinding(value.result||value.toolResult||value.params,depth+1)}
function bindSession(info){const id=info?.session_id;if(!id||(id===activeSession&&info.bind_mode!=='resume_latest'))return;generation++;activeSession=id;clearViewer();cursorSequence=info.bind_mode==='resume_latest'?Number(info.cursor_sequence||info.session?.sequence||0):0;currentPresentation={stage:'materials',intent:'',phase:info.session?.phase||''};$('#status').textContent='Подключаюсь к сессии проектирования…';if(info.bind_mode==='resume_latest'&&info.snapshot?.revision&&Number.isSafeInteger(info.snapshot.event_sequence)){const event={event_type:'update',revision:info.snapshot.revision,event_sequence:info.snapshot.event_sequence,phase:info.session?.phase||'',presentation:{stage:'materials',phase:info.session?.phase||''}};bootstrapExact(event,generation,cursorSequence)}else{refresh();drainEvents()}}
function sendPending(){const p=pendingEvent;if(!p||!viewerDocumentReady||!p.document_token||p.generation!==generation)return;clearPendingTimer();const payload={type:'house-design-update',session_id:p.session_id,document_token:p.document_token,revision:p.revision,event_sequence:p.event_sequence,data:p.data,presentation:p.presentation,assets:p.assets};$('#viewer').contentWindow?.postMessage(payload,'*');const g=generation,token=p.document_token,seq=p.event_sequence,rev=p.revision;pendingTimer=setTimeout(()=>{if(!pendingEvent||g!==generation||pendingEvent.document_token!==token||pendingEvent.event_sequence!==seq||pendingEvent.revision!==rev)return;pendingRetries++;if(pendingRetries<=3){$('#status').textContent=liveLabel(lastSessionState)+' · Ожидаю подтверждение отрисовки, повтор '+pendingRetries;sendPending()}else{pendingRetries=0;$('#status').textContent=liveLabel(lastSessionState)+' · Нет подтверждения отрисовки; повторю тот же снимок';pendingTimer=setTimeout(()=>sendPending(),4000)}},1600)}
async function bootstrapExact(event,gen,cursorAfter,assets={}){if(gen!==generation)return;const sessionId=activeSession;pendingEvent={session_id:sessionId,revision:event.revision,event_sequence:event.event_sequence,cursorAfter,generation:gen,data:event.data,presentation:event.presentation||{stage:'materials',phase:event.phase||''},assets};try{const result=await callTool('get_house_design_viewer',{session_id:sessionId,snapshot_revision:event.revision,event_sequence:event.event_sequence});textResult(result);const v=result?._meta?.houseDesign;if(gen!==generation||activeSession!==sessionId||!pendingEvent||pendingEvent.generation!==gen||pendingEvent.event_sequence!==event.event_sequence)return;if(!v||v.session_id!==sessionId||v.revision!==event.revision||v.event_sequence!==event.event_sequence||!v.document_token||!v.html||!v.data)throw Error('Ответ просмотрщика не совпал с точным событием');pendingEvent.data=v.data;pendingEvent.presentation=v.presentation||pendingEvent.presentation;pendingEvent.document_token=v.document_token;documentToken=v.document_token;pendingEvent.assets={...pendingEvent.assets,...assets};currentPresentation=pendingEvent.presentation;if(!viewerDocumentStarted){viewerDocumentStarted=true;$('#viewer').srcdoc=viewerDocument(v.html)}else if(documentToken!==v.document_token)throw Error('Попытка заменить документ текущей сессии');if(viewerDocumentReady)sendPending()}catch(e){if(gen===generation&&activeSession===sessionId&&pendingEvent?.event_sequence===event.event_sequence){$('#status').textContent=liveLabel(lastSessionState)+' · '+(e.message||'Не удалось открыть точный снимок');clearPendingTimer();pendingTimer=setTimeout(()=>bootstrapExact(event,gen,cursorAfter,assets),2500)}}}
async function consumeEvent(event,assets,gen){if(!event||!Number.isSafeInteger(event.event_sequence)||event.event_sequence<=cursorSequence)throw Error('Нарушен порядок событий сессии');if(event.event_type==='update'){if(!viewerDocumentStarted){await bootstrapExact(event,gen,event.event_sequence,assets);return true}pendingEvent={...event,session_id:activeSession,cursorAfter:event.event_sequence,generation:gen,document_token:documentToken,assets};if(viewerDocumentReady)sendPending();return true}cursorSequence=event.event_sequence;currentPresentation.phase=event.phase||currentPresentation.phase;return false}
async function drainEvents(){if(!activeSession||pendingEvent||eventFetchInFlight)return;const gen=generation;eventFetchInFlight=true;try{for(let n=0;n<64;n++){if(gen!==generation||!activeSession)return;const result=await callTool('get_house_design_updates',{session_id:activeSession,after_sequence:cursorSequence,limit:1}),meta=result?._meta?.houseDesign;textResult(result);if(gen!==generation||!meta||meta.session_id!==activeSession) return;if(!Array.isArray(meta.events))throw Error('Пакет событий не совпал с сессией');if(!meta.events.length)return;const event=meta.events[0];const stopped=await consumeEvent(event,meta.assets||{},gen);if(stopped)return}Promise.resolve().then(drainEvents)}catch(e){if(gen===generation)$('#status').textContent=liveLabel(lastSessionState)+' · '+(e.message||'Ошибка потока событий')}finally{if(gen===generation)eventFetchInFlight=false}}
async function refresh(){if(!activeSession){$('#status').textContent=liveLabel(null);return}const gen=generation;try{const result=await callTool('get_house_design_status',{session_id:activeSession}),data=textResult(result),session=data.session;if(gen!==generation)return;if(!session){$('#status').textContent='Сессия проектирования не найдена';clearViewer();return}lastSessionState=session;if(!loadedRevision&&!pendingEvent)currentPresentation.phase=session.phase||currentPresentation.phase;$('#status').textContent=liveLabel(session);drainEvents()}catch(e){if(gen===generation)$('#status').textContent=e.message||'Ошибка связи с сессией'}}
function receiveToolResult(value){const binding=extractBinding(value);if(binding?.session_id){if(binding.bind_mode)bindSession(binding);else if(binding.session_id===activeSession)drainEvents();else bindSession(binding)}}
async function start(){try{if(mcpMode){const init=await initialize();receiveToolResult(init?.hostContext?.toolResult)}}catch(e){$('#status').textContent=e.message||'Не удалось подключиться к приложению'}const tick=async()=>{await refresh();setTimeout(tick,1000)};setTimeout(tick,1000)}
window.addEventListener('message',e=>{const d=e.data,frame=$('#viewer');if(e.source===window.parent&&e.origin===mcpOrigin&&d?.method==='ui/notifications/tool-result'){receiveToolResult(d.params);return}if(e.source!==frame.contentWindow||!d||d.session_id!==activeSession||d.document_token!==documentToken)return;if(d.type==='house-design-ready'){if(!d.identity_preserved){$('#status').textContent=liveLabel(lastSessionState)+' · Ошибка идентичности viewer';return}viewerDocumentReady=true;if(pendingEvent)sendPending();else drainEvents();return}if(d.type==='house-design-failed'){const p=pendingEvent;if(!p||d.event_sequence!==p.event_sequence||d.revision!==p.revision)return;$('#status').textContent=liveLabel(lastSessionState)+' · '+(d.error||'Viewer отклонил снимок');clearPendingTimer();pendingTimer=setTimeout(()=>sendPending(),800);return}if(d.type==='house-design-applied'){const p=pendingEvent;if(!p||p.generation!==generation||d.event_sequence!==p.event_sequence||d.revision!==p.revision||d.session_id!==p.session_id||d.document_token!==p.document_token||d.identity_preserved!==true)return;clearPendingTimer();cursorSequence=p.cursorAfter;loadedRevision=p.revision;currentPresentation={...(p.presentation||{}),stage:d.stage||'materials',intent:d.intent||'',phase:d.phase||p.presentation?.phase||''};frame.dataset.appliedRevision=d.revision;frame.dataset.appliedEventSequence=String(d.event_sequence);frame.dataset.canvasId=d.canvas_id||'';frame.dataset.documentId=d.document_id||'';frame.dataset.rendererId=d.renderer_id||'';frame.dataset.sceneId=d.scene_id||'';frame.dataset.cameraId=d.camera_id||'';frame.dataset.controlsId=d.controls_id||'';frame.dataset.stage=d.stage||'';pendingEvent=null;pendingViewer=null;pendingRetries=0;Promise.resolve().then(drainEvents)}});$('#viewer').addEventListener('load',reportSize);start();</script></body></html>
